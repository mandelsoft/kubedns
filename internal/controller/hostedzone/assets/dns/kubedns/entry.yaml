apiVersion: coredns.mandelsoft.org/v1alpha1
kind: CoreDNSEntry
metadata:
  name: (( values.dns.name ))
  namespace: (( values.dns.namespace ))

  labels:
    target: dataplane
    app: (( values.runtime.label ))
spec:
  zoneRef: nameserver
  class: (( values.dns.class || ~~ ))
  dnsNames: (( values.dns.dnsnames ))
  A: (( values.dns.ips || ~~ ))
  CNames: (( values.dns.cnames || ~~ ))
kind: ConfigMap
metadata:
  name: (( values.runtime.name ))
  namespace: (( values.runtime.namespace ))
  labels:
    target: runtime
    app: (( values.runtime.label ))
data:
  # The key name here ('Corefile') will be the filename in the volume mount
  Corefile: |
    .:53 {
      errors
      health
      ready
      cache 30
      kubedyndns . {
        mode Primary
        zoneobject (( values.dataplane.zone ))
        namespaces (( values.dataplane.namespace ))
        transitive
        (( (values.runtime.secret != "" ) ? "endpoints " values.dataplane.server  :"" ))
        (( (values.runtime.secret != "" ) ? "token /etc/coredns/token /etc/coredns/ca.crt" :"" ))
        ttl 30
      }
    }
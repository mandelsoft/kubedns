apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: (( values.deployment.name ))
  namespace: (( values.dataplane.namespace ))
  labels:
    target: dataplane
    app: (( values.deployment.label ))
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dns-service-writer-role # <--- UPDATED NAME HERE
subjects:
  - kind: ServiceAccount
    name: dns-service-sa
    namespace: default
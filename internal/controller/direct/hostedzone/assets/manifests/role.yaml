resource:
  <<<: (( &temporary ))
  apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
    name: (( values.dataplane.name ))
    namespace: (( values.dataplane.namespace ))
    labels:
      target: dataplane
      app: (( values.dataplane.label ))
  rules:
    # Granting FULL access to common networking and discovery resources
    - apiGroups: ["coredns.mandelsoft.org"] # Core API Group
      resources: ["hostedzones", "corednsentries"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["coredns.mandelsoft.org"] # Core API Group
      resources: ["hostedzones/status", "corednsentries/status"]
      verbs: ["get", "update", "patch"]
      # A simpler way to grant all verbs is ["*"]

manifest: (( optional(values.dataplane.required, resource) ))
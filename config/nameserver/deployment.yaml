apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  labels:
    app: dns-service-nameserver
  name: dns-service-nameserver
  namespace: dns-system
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: dns-service-nameserver
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dns-service-nameserver
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - -conf
        - /etc/coredns/config/Corefile
        image: mandelsoft/coredns:latest
        imagePullPolicy: Always
        name: dns-container
        ports:
        - containerPort: 53
          name: dns-udp
          protocol: UDP
        volumeMounts:
        - mountPath: /etc/coredns/access
          name: secret-volume
          readOnly: true
        - mountPath: /etc/coredns/config
          name: config-volume
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: secret-volume
        secret:
          defaultMode: 420
          items:
          - key: token
            path:  token
          - key: ca.crt
            path:  ca.crt
          secretName: controller-manager-dataplane
      - configMap:
          defaultMode: 420
          items:
          - key: Corefile
            path: Corefile
          name: dns-service-nameserver
        name: config-volume

# This rule is not used by the project kubedns itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to coredns.mandelsoft.org resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubedns
    app.kubernetes.io/managed-by: kustomize
  name: coredns-corednsentry-viewer-role
rules:
- apiGroups:
  - coredns.mandelsoft.org
  resources:
  - corednsentries
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coredns.mandelsoft.org
  resources:
  - corednsentries/status
  verbs:
  - get

# This rule is not used by the project kubedns itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over coredns.mandelsoft.org.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubedns
    app.kubernetes.io/managed-by: kustomize
  name: coredns-corednsentry-admin-role
rules:
- apiGroups:
  - coredns.mandelsoft.org
  resources:
  - corednsentries
  verbs:
  - '*'
- apiGroups:
  - coredns.mandelsoft.org
  resources:
  - corednsentries/status
  verbs:
  - get

apiVersion: v1
kind: Namespace
metadata:
  name: (( values.account ))
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: namespace-admin
  namespace: (( values.account ))
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubedns
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
  name: coredns-admin
rules:
- apiGroups:
  - coredns.mandelsoft.org
  resources:
  - hostedzones
  - corednsentries
  verbs:
  - '*'
- apiGroups:
  - coredns.mandelsoft.org
  resources:
  - hostedzones/status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: namespace-admin-binding
  namespace: (( values.account ))
subjects:
- kind: ServiceAccount
  name: namespace-admin
  namespace: (( values.account ))
roleRef:
  kind: ClusterRole
  name: admin  # Built-in role for full access within a namespace
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: namespace-dns-binding
  namespace: (( values.account ))
subjects:
- kind: ServiceAccount
  name: namespace-admin
  namespace: (( values.account ))
roleRef:
  kind: ClusterRole
  name: coredns-admin
  apiGroup: rbac.authorization.k8s.io


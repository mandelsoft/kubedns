---
apiVersion: v1
kind: Namespace
metadata:
  name: dns-system
---
apiVersion: v1
kind: Service
metadata:
  name: dns-service-restserver
  namespace: dns-system

  labels:
    target: runtime
    app: dns-service-restserver
spec:
  type: ClusterIP

  # Selects the pods created by the Deployment
  selector:
    app: dns-service-restserver

  ports:
    - name: api
      protocol: TCP
      port: 80         # The port the Service exposes
      targetPort: api    # The containerPort defined in the Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dns-service-restserver
  name: dns-service-restserver
  namespace: dns-system
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: dns-service-restserver
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dns-service-restserver
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --log-level=info
        - --kubeconfig=/etc/coredns/dataplane/kubeconfig
        - --kubeconfig-endpointslice=coredns.mandelsoft.org  # required for KCP
        - --kubeconfig-identity=demo
        - --controllers=server
        - --dnsapi=:8085
        - --slave-mode=true
        image: mandelsoft/kubedns:latest
        imagePullPolicy: Always
        name: dns-container
        ports:
        - containerPort: 8085
          name: api
          protocol: TCP
        volumeMounts:
        - mountPath: /etc/coredns/dataplane
          name: secret-volume
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: secret-volume
        secret:
          defaultMode: 420
          items:
          - key: kubeconfig
            path: kubeconfig
          secretName: controller-manager-restdataplane

